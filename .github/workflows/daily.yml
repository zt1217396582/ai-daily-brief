name: AI 资讯早报
on:
  schedule:
    - cron: '25 23 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 新闻日期（香港时间，YYYY-MM-DD，留空取昨天）
        required: false
        type: string

concurrency:
  group: daily-brief
  cancel-in-progress: false

permissions: {}

jobs:
  generate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: 检索并生成
        id: brief
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          args=()
          if [[ -n "$ISSUE_DATE" ]]; then args+=(--date "$ISSUE_DATE"); fi
          python -m ai_brief "${args[@]}"
      - name: 保存日报或断点
        if: ${{ !cancelled() && steps.brief.outcome != 'skipped' }}
        shell: bash
        run: |
          mkdir -p editions progress
          git add -A -- editions progress
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '更新早报归档及运行进度'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布静态日报
        id: deployment
        uses: actions/deploy-pages@v4
